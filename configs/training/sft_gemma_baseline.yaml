# configs/training/sft_gemma_baseline.yaml

# Experiment metadata
experiment_name: "gemma_sft_baseline"
random_seed: 42

# Model configuration
model:
  model_name_or_path: "google/gemma-3-4b-it"
  model_type: "gemma"
  load_in_4bit: false  # Set true for QLoRA
  load_in_8bit: false
  trust_remote_code: true
  cache_dir: null
  token: null  # HF token if needed
  attn_implementation: "flash_attention_2"
# Data configuration
data:
  train_dataset_path: "data/vitoed_new/train.json"
  eval_dataset_path: "data/vitoed_new/dev.json"
  max_seq_length: 2048
  packing: false

# Prompt configuration (REUSE from inference!)
prompt:
  technique: "re2_pas_cot"  # or few_shot, few_shot_cot, etc.
  language: "vi"
  n_shot: 3  # Only for few_shot techniques
  examples_pool_path: "data/vitoed_new/train.json"  # Only for few_shot
  plus_mode: false  # Only for plan_and_solve
  add_method: "none"  # Only for rereading

# LoRA configuration
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  
  # QLoRA settings
  use_qlora: false
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# Training arguments
training:
  output_dir: "results/training/gemma_sft_baseline"
  
  # Duration
  num_train_epochs: 5
  max_steps: -1
  
  # Batch size
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  
  # Optimizer
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  optim: "paged_adamw_32bit"
  
  # Logging & Saving
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 2
  eval_strategy: "no"  # "epoch" to enable eval
  
  # Precision & Optimization
  gradient_checkpointing: true
  bf16: true
  fp16: false
  max_grad_norm: 0.3