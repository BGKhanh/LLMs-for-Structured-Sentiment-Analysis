# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42
cleanup_frequency: 0

experiment:
  name: "Gemma_Fewshot_CoT_experiment_3"
  description: "Few-shot CoT technique, n-shot = 1, google/gemma-3-4b-it, new parameters"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "gemma"  # one of [gemma, mistral, qwen, llama]
  init_args:
    model_id: "google/gemma-3-4b-it"
    dtype: "float16"
    device_map: "auto"
    trust_remote_code: true
    attn_implementation: "flash_attention_2"

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 2048
    do_sample: true
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    enable_thinking: true


data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "/kaggle/input/vitoed/train.json"
  dev_dataset_path: "/kaggle/input/vitoed/dev.json"
  test_dataset_path: "/kaggle/input/vitoed/test.json"

  examples_pool: "train"
  batch_size: 8
  num_samples: null   # null = use all samples
  num_workers: 2

prompt:
  technique: "few_shot_cot"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 1
  examples_pool_path: null
  plus_mode: false

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
