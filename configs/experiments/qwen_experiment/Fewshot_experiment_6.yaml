# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "Qwen_Fewshot_experiment_6"
  description: "Few-shot technique, n-shot = 2, Qwen/Qwen3-4B-Instruct-2507, new parameters"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "qwen"  # one of [gemma, mistral, qwen, llama]
  init_args:
    model_id: "Qwen/Qwen3-4B-Instruct-2507"
    dtype: "float32"
    device_map: "auto"
    trust_remote_code: true

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 1024
    do_sample: true
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    enable_thinking: true


data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "data/train.json"
  dev_dataset_path: "data/dev.json"
  test_dataset_path: "data/test.json"

  examples_pool: "train"
  batch_size: 4
  num_samples: null   # null = use all samples
  num_workers: 2

prompt:
  technique: "few_shot"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 2
  examples_pool_path: null
  plus_mode: false

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
