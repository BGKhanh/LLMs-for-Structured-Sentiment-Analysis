# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "Re2_FewShot_CoT_experiment_1"
  description: "Re-reading + Few-shot CoT technique, experiment 1, n-shot = 1, SeaLLMs/SeaLLMs-v3-7B-Chat, generation parameters 2"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "seallm"  # one of [gemma, mistral, qwen, llama]
  init_args:
    model_id: "SeaLLMs/SeaLLMs-v3-7B-Chat"
    dtype: "bfloat16"
    device_map: "auto"
    trust_remote_code: true
    attn_implementation: "flash_attention_2"

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 2048
    do_sample: true
    temperature: 0.1
    top_p: 0.95
    top_k: 50

data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "data/vitoed_new/train.json"
  dev_dataset_path: "data/vitoed_new/dev.json"
  test_dataset_path: "data/vitoed_new/test.json"

  examples_pool: "train" # Pool to pick the 1 shot from
  batch_size: 16
  num_samples: null # Run all samples
  num_workers: 8

prompt:
  technique: "rereading"
  language: "vi"
  n_shot: 1   
  examples_pool_path: null
  plus_mode: false       
  add_method: "FewShot_CoT" # Re-reading + Few-shot (from file)

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false