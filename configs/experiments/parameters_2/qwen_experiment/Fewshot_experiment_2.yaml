# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "Fewshot_experiment_2"
  description: "Few-shot technique, experiment 2, n-shot = 1, generation parameters 2"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "qwen"  # one of [gemma, mistral, qwen, llama]
  init_args:
    model_id: "Qwen/Qwen3-4B-Instruct-2507"
    dtype: "bfloat16"
    device_map: "auto"
    trust_remote_code: true
    attn_implementation: "flash_attention_2"

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 2048
    do_sample: true
    temperature: 0.1
    top_p: 0.95
    top_k: 50


data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "data/vitoed_new/train.json"
  dev_dataset_path: "data/vitoed_new/dev.json"
  test_dataset_path: "data/vitoed_new/test.json"

  examples_pool: "train"
  batch_size: 16
  num_samples: null   # null = use all samples
  num_workers: 8

prompt:
  technique: "few_shot"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 1
  examples_pool_path: null
  plus_mode: false

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
