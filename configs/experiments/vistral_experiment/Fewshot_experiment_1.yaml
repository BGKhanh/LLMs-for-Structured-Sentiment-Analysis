# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "Vistral_Fewshot_experiment_1"
  description: "Few-shot technique, n-shot = 0, Viet-Mistral/Vistral-7B-Chat"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "vistral"  # one of [gemma, mistral, qwen, llama]
  init_args:
    model_id: "Viet-Mistral/Vistral-7B-Chat"
    dtype: "bfloat16"
    device_map: "auto"
    trust_remote_code: true
    attn_implementation: "flash_attention_2"

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 1024
    do_sample: false
    temperature: 0.1
    top_p: 0.95
    top_k: 50
    enable_thinking: true


data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "data/train.json"
  dev_dataset_path: "data/dev.json"
  test_dataset_path: "data/test.json"

  examples_pool: "train"
  batch_size: 4
  num_samples: null   # null = use all samples
  num_workers: 2

prompt:
  technique: "few_shot"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 0
  examples_pool_path: null
  plus_mode: false

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
