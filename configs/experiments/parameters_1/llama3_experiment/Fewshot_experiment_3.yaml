# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "Fewshot_experiment_3"
  description: "Few-shot technique, experiment 11, n-shot = 2, meta-llama/Llama-3.2-3B-Instruct"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "llama3"  # one of [gemma, mistral, qwen, llama]
  model_id: "meta-llama/Llama-3.2-3B-Instruct"
  dtype: "float32"
  device_map: "auto"
  trust_remote_code: true
  enable_thinking: true

  # === GENERATION PARAMETERS ===
  max_new_tokens: 2048
  do_sample: false
  temperature: 0.1
  top_p: 0.95
  top_k: 50


data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "/kaggle/input/vitoed/train.json"
  dev_dataset_path: "/kaggle/input/vitoed/dev.json"
  test_dataset_path: "/kaggle/input/vitoed/test.json"

  examples_pool: "train"
  batch_size: 4
  num_samples: null   # null = use all samples
  num_workers: 4

prompt:
  technique: "few_shot"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 2
  examples_pool_path: null
  plus_mode: false

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
