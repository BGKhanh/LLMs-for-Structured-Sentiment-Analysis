# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "Seallm_Re_reading_plus_CoT_experiment_1"
  description: "Re-reading + Chain-of-Thought technique, add_method = 0_CoT, BlossomsAI/BloomVN-8B-chat"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "seallm"  # one of [gemma, mistral, qwen, llama]
  init_args:
    model_id: "BlossomsAI/BloomVN-8B-chat"
    dtype: "float16"
    device_map: "auto"
    trust_remote_code: true

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 2048
    do_sample: false
    temperature: 0.1
    top_p: 0.95
    top_k: 50
    enable_thinking: true


data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "/kaggle/input/vitoed/train.json"
  dev_dataset_path: "/kaggle/input/vitoed/dev.json"
  test_dataset_path: "/kaggle/input/vitoed/test.json"

  examples_pool: "train"
  batch_size: 4
  num_samples: null   # null = use all samples
  num_workers: 2

prompt:
  technique: "rereading"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 0
  examples_pool_path: null
  plus_mode: false
  add_method: "0_CoT"

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
