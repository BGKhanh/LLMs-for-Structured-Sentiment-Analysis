# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42
cleanup_frequency: 0

experiment:
  name: "test10"
  description: "Testing Llama4 model"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "llama4"  
  model_id: "meta-llama/Llama-4-Scout-17B-16E-Instruct"
  torch_dtype: "float16"
  device_map: "auto"
  trust_remote_code: true
  enable_thinking: true
  # === GENERATION PARAMETERS ===
  max_new_tokens: 2048
  do_sample: false
  temperature: 0.1
  top_p: 0.95
  top_k: 50


data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "/kaggle/input/vitoed/train.json"
  dev_dataset_path: "/kaggle/input/vitoed/dev.json"
  test_dataset_path: "/kaggle/input/vitoed/test.json"

  examples_pool: "train"
  batch_size: 4
  num_samples: 32   # null = use all samples
  num_workers: 2

prompt:
  technique: "few_shot"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 1
  examples_pool_path: null
  plus_mode: false

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
