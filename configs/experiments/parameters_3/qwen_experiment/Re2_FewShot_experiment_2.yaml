# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "Re2_FewShot_experiment_2"
  description: "Re-reading + Few-shot technique, experiment 2, n-shot = 2, generation parameters 3"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "qwen"
  init_args:
    model_id: "Qwen/Qwen3-4B-Instruct-2507"
    dtype: "bfloat16"
    device_map: "auto"
    trust_remote_code: true
    attn_implementation: "flash_attention_2"

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 2048
    do_sample: true
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    enable_thinking: true

data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "data/vitoed_new/train.json"
  dev_dataset_path: "data/vitoed_new/dev.json"
  test_dataset_path: "data/vitoed_new/test.json"

  examples_pool: "train" # Pool to pick the 1 shot from
  batch_size: 16
  num_samples: null # Run all samples
  num_workers: 8

prompt:
  technique: "rereading"
  language: "vi"
  n_shot: 2  
  examples_pool_path: null
  plus_mode: false       
  add_method: "FewShot" # Re-reading + Few-shot (from file)

output:
  output_dir: "results/"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false