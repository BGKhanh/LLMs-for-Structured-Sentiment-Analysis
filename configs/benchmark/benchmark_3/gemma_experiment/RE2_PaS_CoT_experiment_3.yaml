# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "RE2_PaS_CoT_experiment_benchmark_3"
  description: "Re-reading + Plan and Solve + Chain-of-Though technique, experiment 3, n-shot = 3, GemmaModel, num_samples = 100, parameters 3"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "gemma"  # one of [gemma, mistral, qwen, llama]
  init_args:
    model_id: "google/gemma-3-4b-it"
    dtype: "bfloat16"
    device_map: "auto"
    trust_remote_code: true
    attn_implementation: "flash_attention_2"

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 2048
    do_sample: true
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0

data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "data/vitoed_new/train.json"
  dev_dataset_path: "data/vitoed_new/dev.json"
  test_dataset_path: "data/vitoed_new/test.json"

  examples_pool: "train"
  batch_size: 16
  num_samples: 100   # null = use all samples
  num_workers: 8

prompt:
  technique: "re2_pas_cot"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 3                # just for few-shot and few-shot CoT technique
  examples_pool_path: null
  plus_mode: true         # just for plan-and-solve technique
  add_method: "none"        # just for rereading technique

output:
  output_dir: "results/benchmark_3"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
  