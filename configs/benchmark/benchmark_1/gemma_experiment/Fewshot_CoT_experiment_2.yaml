# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "Gemma_Fewshot_CoT_experiment_benchmark_2"
  description: "Few-shot CoT technique, n-shot = 2, google/gemma-3-4b-it, num_samples = 100"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "gemma"  # one of [gemma, mistral, qwen, llama]
  init_args:
    model_id: "google/gemma-3-4b-it"
    dtype: "bfloat16"
    device_map: "auto"
    trust_remote_code: true
    attn_implementation: "flash_attention_2"

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 2048
    do_sample: false
    temperature: 0.1
    top_p: 0.95
    top_k: 50


data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "data/vitoed_new/test.json"
  dev_dataset_path: "data/vitoed_new/dev.json"
  test_dataset_path: "data/vitoed_new/test.json"

  examples_pool: "train"
  batch_size: 16
  num_samples: 100   # null = use all samples
  num_workers: 8

prompt:
  technique: "few_shot_cot"   # rereading | few_shot | few_shot_cot | zero_shot_cot | plan_and_solve
  language: "vi"
  n_shot: 2
  examples_pool_path: null
  plus_mode: false

output:
  output_dir: "results/benchmark"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false
