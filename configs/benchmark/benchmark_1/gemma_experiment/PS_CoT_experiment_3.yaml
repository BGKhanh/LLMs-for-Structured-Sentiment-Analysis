# =============================================
# Configuration file for inference experiments
# =============================================

random_seed: 42


experiment:
  name: "PS_CoT_experiment_benchmark_3"
  description: "Plan and Solve + Few-shot CoT technique, experiment 3, n-shot = 3, GemmaModel, num_samples = 100"
  version: "1.0"

model:
  # === MODEL LOADING ===
  name: "gemma"
  init_args:
    model_id: "google/gemma-3-4b-it"
    dtype: "bfloat16"
    device_map: "auto"
    trust_remote_code: true
    attn_implementation: "flash_attention_2"

  # === GENERATION PARAMETERS ===
  generation_args:
    max_new_tokens: 4096
    do_sample: false
    temperature: 0.1
    top_p: 0.95
    top_k: 50

data:
  dataset: "dev"   # one of [train, dev, test]
  train_dataset_path: "data/vitoed_new/test.json"
  dev_dataset_path: "data/vitoed_new/dev.json"
  test_dataset_path: "data/vitoed_new/test.json"

  examples_pool: "train" # Pool to pick the 1 shot from
  batch_size: 8
  num_samples: 100 # Run all samples
  num_workers: 8

prompt:
  technique: "plan_and_solve"
  language: "vi"
  n_shot: 3   
  examples_pool_path: null
  plus_mode: true       
  add_method: "none" # Re-reading + Few-shot (from file)

output:
  output_dir: "results/benchmark"
  output_file: "results.json"
  save_metadata: true
  save_config_copy: true
  overwrite: false