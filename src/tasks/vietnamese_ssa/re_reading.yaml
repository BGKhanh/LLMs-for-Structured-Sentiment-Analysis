include: _common_yaml
task: vietnamese_ssa_re_reading
tag: vietnamese_ssa

custom_dataset: !function utils.load_dataset
test_split: test
training_split: train
validation_split: dev

description: "{{system_prompt}}"
doc_to_text: !function utils.re_reading_doc_to_text
doc_to_target: "{{opinions_json}}"

fewshot_config:
  sampler: default
  split: train
  doc_to_text: !function utils.re_reading_fewshot_doc_to_text
  doc_to_target: !function utils.re_reading_fewshot_doc_to_target
  target_delimiter: " "
  fewshot_delimiter: "\n\n"

metadata:
  version: 2.0
  technique: re_reading
  description: >
    Vietnamese SSA — Re-reading (câu hỏi được lặp lại 2 lần). Chỉ re-reading
    thuần (tương đương add_method="none" ở bản legacy) — KHÔNG kết hợp với
    CoT/PaS trigger trong phạm vi hiện tại. Fewshot examples sampled natively
    từ train split, mỗi ví dụ cũng được lặp lại câu hỏi theo cùng định dạng.