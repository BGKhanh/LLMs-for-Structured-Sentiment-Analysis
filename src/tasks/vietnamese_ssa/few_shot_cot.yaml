include: _common_yaml
task: vietnamese_ssa_few_shot_cot
tag: vietnamese_ssa

custom_dataset: !function utils.load_dataset
test_split: test
training_split: train
validation_split: dev

description: "{{system_prompt}}"
doc_to_text: !function utils.cot_doc_to_text
doc_to_target: "{{opinions_json}}"

# CoT reasoning demos are longer than plain few-shot; give more headroom.
generation_kwargs:
  until:
    - "\n\n\n\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
    - "<end_of_turn>"
  max_gen_toks: 4096
  temperature: 0.0
  top_p: 0.95
  top_k: 50
  do_sample: false

fewshot_config:
  sampler: default
  # NOTE: no `split:` here — the pool is a hand-written static list with a
  # `reasoning` field that doesn't exist in train.json, so we use `samples`
  # (a zero-arg callable) instead of sampling from a real dataset split.
  samples: !function utils.get_cot_pool
  doc_to_text: !function utils.cot_fewshot_doc_to_text
  doc_to_target: !function utils.cot_fewshot_doc_to_target
  target_delimiter: "\n\n"
  fewshot_delimiter: "\n\n\n"

metadata:
  version: 2.0
  technique: few_shot_cot
  description: >
    Vietnamese SSA — Few-shot Chain-of-Thought. Pool ví dụ (có reasoning)
    lấy tĩnh từ src/prompt_templates/shared.py (_HARDCODED_POOL), không
    lấy từ train.json thật. --num_fewshot kiểm soát số ví dụ lấy từ pool
    này (tối đa = độ dài pool của ngôn ngữ tương ứng).