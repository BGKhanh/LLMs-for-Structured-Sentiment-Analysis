include: _common_yaml
task: vietnamese_ssa_plan_and_solve
tag: vietnamese_ssa

custom_dataset: !function utils.load_dataset
test_split: test
training_split: train
validation_split: dev

description: "{{system_prompt}}"
doc_to_text: !function utils.plan_and_solve_doc_to_text
doc_to_target: "{{opinions_json}}"

# Plan-and-Solve is instruction-only — matches legacy PlanAndSolveContent,
# which always discards the examples pool. Unlike the other 3 technique
# yamls, `num_fewshot: 0` IS set here on purpose: with no `fewshot_config`
# at all, forcing --num_fewshot > 0 via CLI would otherwise crash with
# "no documents available for sampling" (ContextSampler has nothing to draw
# from). Locking it to 0 makes the harness print a clear one-line notice
# ("num_fewshot has been set to 0 ... Manual configuration will be
# ignored.") instead of a stack trace if someone passes --num_fewshot > 0
# by mistake.
num_fewshot: 0
 
num_fewshot: 0

metadata:
  version: 2.0
  technique: plan_and_solve
  description: >
    Vietnamese SSA — Plan-and-Solve (chỉ instruction, không ví dụ).
    Dùng --metadata '{"plus_mode": true}' để bật biến thể PS+.